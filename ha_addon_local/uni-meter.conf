uni-meter {
  output = "uni-meter.output-devices.sma-em"
  input  = "uni-meter.input-devices.homewizard-p1"

  # Not port 80: avoid clashes with other add-ons on the host network
  http-server {
    port = 18080
  }
  mdns { type = "none" }

  output-devices {
    sma-em {
      # IP address of the SMA inverter (unicast)
      group = "INVERTER-IP"
      port = 9522
      send-interval = 1s
      serial-number = 1900123456
      susy-id = 270
      forget-interval = 10s
    }
  }

  input-devices {
    homewizard-p1 {
      url = "http://P1-IP"
      polling-interval = 1s
      request-timeout = 3s
    }
  }
}
