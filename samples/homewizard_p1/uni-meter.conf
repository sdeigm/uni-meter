uni-meter {
  output = "uni-meter.output-devices.sma-em"

  input = "uni-meter.input-devices.homewizard-p1"

  output-devices {
    sma-em {
      # Multicast (default). On mesh Wi-Fi (e.g. Deco) multicast is often unreliable:
      # use the inverter's fixed IP instead, e.g. group = "192.168.0.40" (unicast)
      group = "239.12.255.254"
      port = 9522
      send-interval = 1s
      # Stop sending if the P1 delivers no data, so the inverter falls back to its safe mode
      forget-interval = 10s
      # Choose a unique serial number and select it in the Sunny Boy (Sunny Portal / web UI) as energy meter
      serial-number = 1900123456
      susy-id = 270
    }
  }

  input-devices {
    homewizard-p1 {
      # IP address of the HomeWizard Wi-Fi P1 meter ("Local API" must be enabled in the HomeWizard Energy app)
      url = "http://192.168.178.50"
      polling-interval = 1s
    }
  }
}
